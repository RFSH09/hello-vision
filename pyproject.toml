[project]
name = "hello-vision"
version = "0.0.1"
description = "Research prototype: in-house product recognition for smart vending fridges."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sharifjon Farmonov" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime dependencies are added milestone by milestone, permissive licenses only
# (see docs/LICENSES.md). Nothing is needed for M0.
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]
train = ["torch>=2.3", "torchvision>=0.18"]
# zero-shot detection / identification (large download; weights go to models/, never to git)
vision = ["torch>=2.7", "torchvision>=0.22", "transformers>=4.50", "scipy>=1.13"]

[project.scripts]
hv-demo = "sim.run_video:main"
hv-batch = "sim.run_video:batch"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hello_vision", "sim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "D", "ANN", "S", "RUF"]
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101", "S105", "E501", "RUF059"]
"hello_vision/review/ui.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["hello_vision", "sim", "eval", "tools/hooks", "tools/import_packshots.py", "tools/gen_synthetic.py", "tools/fetch_face_model.py", "tools/labeling_convert.py", "tools/weak_labels.py"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "torch", "torch.*", "torchvision", "torchvision.*", "transformers", "scipy", "scipy.*", "gradio"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
